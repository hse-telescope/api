openapi: 3.0.0
info:
  title: Telescope Auth Service
  description: API for user authentication with JWT and refresh tokens
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /ping:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: Service is running
          content:
            text/plain:
              example: pong

  /users:
    get:
      summary: Get all users (protected)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized - missing or invalid token
        '500':
          description: Internal server error

  /register:
    post:
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request data
        '409':
          description: User already exists
        '500':
          description: Internal server error

  /login:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request data
        '401':
          description: Incorrect password
        '404':
          description: User not found
        '500':
          description: Internal server error

  /refresh:
    post:
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request data
        '401':
          description: Invalid or expired refresh token
        '500':
          description: Internal server error

  /logout:
    post:
      summary: Logout user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logout successful!
        '400':
          description: Invalid request data
        '500':
          description: Internal server error

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: user1
        password:
          type: string
          example: hashed_password_string

    Credentials:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: user1
        password:
          type: string
          example: password123

    TokenRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: Refresh token
          example: "refresh_token_string"

    TokenResponse:
      type: object
      properties:
        message:
          type: string
          example: Login successful!
        access_token:
          type: string
          description: JWT access token (valid for 15 minutes)
          example: "jwt_token_string"
        refresh_token:
          type: string
          description: Refresh token (valid for 7 days)
          example: "refresh_token_string"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT